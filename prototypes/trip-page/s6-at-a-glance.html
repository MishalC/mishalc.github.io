    const TYPE_ICONS = {

      arrival:  `<svg width="13" height="13" fill="none" viewBox="0 0 24 24"><polyline points="17 11 12 6 7 11" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="6" x2="12" y2="18" stroke="#6b7280" stroke-width="2" stroke-linecap="round"/></svg>`
    };

    const STATUS_CONFIG = {
      confirmed: {
        dot: '#12B28C',
        badgeBg: '#12B28C18',
        badgeColor: '#12B28C',
        label: 'Confirmed',
        cardBorder: '#eae3d7',
        cardBg: 'white'
      },
      decision: {
        dot: '#4f46e5',
        badgeBg: '#4f46e518',
        badgeColor: '#4f46e5',
        label: 'Needs decision',
        cardBorder: '#4f46e540',
        cardBg: '#4f46e50a'
      },
      pending: {
        dot: '#d1d5db',
        badgeBg: '#f3f4f6',
        badgeColor: '#9ca3af',
        label: 'Pending',
        cardBorder: '#eae3d7',
        cardBg: 'white'
      }
    };

    function buildTimeline() {
      const container = document.getElementById('timeline');
      container.innerHTML = '';

      DAYS.forEach((day, di) => {
        const isLastDay = di === DAYS.length - 1;

        // ── Day header ──────────────────────────────────────
        const dayHeader = document.createElement('div');
        dayHeader.id = `day-${day.num}`;
        dayHeader.style.cssText = 'display:flex; gap:12px; padding-top:16px;';

        // Left column: D-badge + connector down to first item
        dayHeader.innerHTML = `
          <div style="width:28px; flex-shrink:0; display:flex; flex-direction:column; align-items:center;">
            <div style="width:28px; height:28px; border-radius:9px; background:#23293a; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
              <span style="font-family:Hanken Grotesk,sans-serif; color:white; font-size:10px; font-weight:700; letter-spacing:0.03em;">D${day.num}</span>
            </div>
            <div style="width:1px; flex:1; background:#eae3d7; margin-top:4px; min-height:10px;"></div>
          </div>
          <div style="flex:1; display:flex; align-items:center; justify-content:space-between; padding-bottom:10px; min-width:0;">
            <div style="min-width:0;">
              <p style="font-size:12px; font-weight:700; color:#23293a; font-family:Hanken Grotesk,sans-serif; line-height:1.3;">${day.date}</p>
              <p style="font-size:11px; color:#9ca3af; font-family:Hanken Grotesk,sans-serif; margin-top:2px;">${day.city}</p>
            </div>
            <a href="s1-trip-page.html" style="display:flex; align-items:center; gap:2px; font-size:10px; font-weight:700; color:#4f46e5; text-decoration:none; font-family:Hanken Grotesk,sans-serif; flex-shrink:0; margin-left:8px;">
              View
              <svg width="10" height="10" fill="none" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
          </div>
        `;
        container.appendChild(dayHeader);

        // ── Timeline items ──────────────────────────────────
        day.items.forEach((item, ii) => {
          const isLastItem = ii === day.items.length - 1;
          const isVeryLast = isLastDay && isLastItem;
          const cfg = STATUS_CONFIG[item.status];

          const row = document.createElement('div');
          row.style.cssText = 'display:flex; gap:12px;';

          row.innerHTML = `
            
            <div style="width:28px; flex-shrink:0; display:flex; flex-direction:column; align-items:center;">
              <div style="width:10px; height:10px; border-radius:50%; background:${cfg.dot}; flex-shrink:0; margin-top:17px; box-shadow:0 0 0 3px ${cfg.dot}22;"></div>
              ${!isVeryLast
                ? `<div style="width:1px; flex:1; background:#eae3d7; margin-top:4px; min-height:8px;"></div>`
                : ''}
            </div>

            
            <div style="flex:1; background:${cfg.cardBg}; border:1px solid ${cfg.cardBorder}; border-radius:16px; padding:11px 13px; margin-bottom:8px; cursor:pointer; transition:border-color 0.15s;">
              
              <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
                <span style="font-size:10px; color:#9ca3af; font-weight:500; font-family:Hanken Grotesk,sans-serif;">${item.time}</span>
                <span style="font-size:10px; font-weight:700; padding:2px 9px; border-radius:20px; background:${cfg.badgeBg}; color:${cfg.badgeColor}; font-family:Hanken Grotesk,sans-serif; white-space:nowrap;">${cfg.label}</span>
              </div>
              
              <div style="display:flex; align-items:center; gap:9px;">
                <div style="width:26px; height:26px; border-radius:8px; background:#f6f4f0; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
                  ${TYPE_ICONS[item.type] || ''}
                </div>
                <div style="flex:1; min-width:0;">
                  <p style="font-size:13px; font-weight:600; color:#23293a; font-family:Hanken Grotesk,sans-serif; line-height:1.3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${item.label}</p>
                  ${item.sub ? `<p style="font-size:11px; color:#9ca3af; font-family:Hanken Grotesk,sans-serif; margin-top:2px;">${item.sub}</p>` : ''}
                </div>
                ${item.status === 'decision'
                  ? `<svg width="16" height="16" fill="none" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`
                  : ''}
              </div>
            </div>
          `;
          container.appendChild(row);
        });
      });
    }

    function scrollToDay(num) {
      const el = document.getElementById(`day-${num}`);
      const container = document.getElementById('scrollContainer');
      if (el && container) {
        const elTop = el.getBoundingClientRect().top;
        const containerTop = container.getBoundingClientRect().top;
        container.scrollTo({ top: container.scrollTop + elTop - containerTop - 8, behavior: 'smooth' });
      }
    }

    buildTimeline();

    const HIGHLIGHT_MAP = {
      'glance':       ['#timeline'],
      'citypills':    ['div[style*="display:flex"][style*="gap:6px"][style*="flex-wrap:wrap"]'],
      'statusbadges': ['span[style*="border-radius:20px"]'],
      'keytime':      ['span[style*="font-size:10px"][style*="color:#9ca3af"]'],
      'tapscroll':    ['#timeline div[style*="cursor:pointer"]']
    };

    function toggleHighlight(checkbox) {
      const key = checkbox.dataset.hl;
      if (!key || !HIGHLIGHT_MAP[key]) return;
      const selectors = HIGHLIGHT_MAP[key];
      selectors.forEach(sel => {
        document.querySelectorAll(sel).forEach(el => {
          if (checkbox.checked) {
            if (!el.style.position || el.style.position === 'static') el.style.position = 'relative';
            el.classList.add('hl-highlight');
          } else {
            const stillHighlighted = Array.from(document.querySelectorAll('.hl-check:checked')).some(cb => {
              const cbKey = cb.dataset.hl;
              if (!cbKey || cbKey === key) return false;
              const cbSels = HIGHLIGHT_MAP[cbKey] || [];
              return cbSels.some(s => { try { return el.matches(s); } catch(e) { return false; } });
            });
            if (!stillHighlighted) el.classList.remove('hl-highlight');
          }
        });
      });
    }

    function updateCount() {
      const total = document.querySelectorAll('.hl-check').length;
      const checked = document.querySelectorAll('.hl-check:checked').length;
      const counter = document.getElementById('hl-counter');
      if (!counter) return;
      counter.textContent = checked + ' / ' + total;
      counter.style.color = checked === total ? '#12B28C' : '#9ca3af';
    }

    updateCount();
  </script>
</body>
</html>
