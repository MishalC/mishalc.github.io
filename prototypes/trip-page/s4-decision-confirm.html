<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S4 — Feedback Modals</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../_shared/fonts.css">
<link rel="stylesheet" href="tailwind.css">
  <style>
    .hl-highlight {
      outline: 2px solid #4f46e5 !important;
      outline-offset: 2px;
      box-shadow: 0 0 0 4px rgba(79,70,229,0.15) !important;
      border-radius: inherit;
      transition: outline 0.2s, box-shadow 0.2s;
    }
  </style>
</head>
<body class="bg-gray-300 min-h-screen font-body flex items-start justify-center gap-5 px-4 py-6">
<a href="/prototypes/" style="position:fixed;right:12px;bottom:12px;z-index:9999;padding:8px 12px;border-radius:999px;background:#0f172a;border:1px solid #334155;color:#e2e8f0;font:500 12px/1.3 'Hanken Grotesk',system-ui,sans-serif;text-decoration:none;box-shadow:0 2px 10px #0006">Prototype by Mishal Chowdhury · names and data replaced · back to portfolio</a>

  
  <div class="shrink-0" style="width:220px; position:sticky; top:24px;">
    <div class="bg-white rounded-2xl shadow-md px-4 py-3">
      <span class="text-[10px] font-semibold text-gray-400 tracking-widest uppercase block text-center mb-3">S4 — Feedback</span>
      <div class="flex flex-col gap-1.5">
        <button onclick="showFeedback('planning')" id="fbtn-planning" class="fbtn px-3 py-1.5 text-xs rounded-full border font-medium transition-all text-center">Post-Planning</button>
        <button onclick="showFeedback('trip')" id="fbtn-trip" class="fbtn px-3 py-1.5 text-xs rounded-full border font-medium transition-all text-center">Post-Trip</button>
      </div>
    </div>
  </div>

  
  <div class="relative overflow-hidden flex flex-col" style="width:390px; height:844px; border-radius:48px; border:10px solid #23293a; box-shadow:0 40px 100px rgba(0,0,0,0.4); background:#f6f4f0;">

    
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-28 h-6 bg-[#23293a] rounded-b-3xl z-30"></div>

    
    <div class="flex justify-between items-center px-7 pt-8 pb-1 bg-[#f6f4f0] shrink-0">
      <span class="text-[11px] font-bold text-[#23293a]">9:41</span>
      <div class="flex items-center gap-1.5">
        <svg width="14" height="10" viewBox="0 0 14 10" fill="none">
          <rect x="0" y="3.5" width="2.5" height="6.5" rx="0.8" fill="#23293a"/>
          <rect x="3.5" y="2" width="2.5" height="8" rx="0.8" fill="#23293a"/>
          <rect x="7" y="0.5" width="2.5" height="9.5" rx="0.8" fill="#23293a"/>
        </svg>
        <svg width="24" height="11" viewBox="0 0 24 11" fill="none">
          <rect x="0.5" y="0.5" width="20" height="10" rx="3" stroke="#23293a" stroke-opacity="0.3"/>
          <rect x="2" y="2" width="14" height="7" rx="1.5" fill="#23293a"/>
        </svg>
      </div>
    </div>

    
    <div class="flex-1 relative overflow-hidden">

      
      <div class="absolute inset-0 bg-[#23293a]/40 z-10" onclick="closeModal()"></div>

      
      <div class="px-4 pt-3 space-y-2 blur-sm select-none pointer-events-none">
        <div class="bg-[#23293a] rounded-2xl h-32"></div>
        <div class="bg-[#4f46e5]/10 rounded-xl h-10"></div>
        <div class="bg-white rounded-2xl h-20 border border-[#eae3d7]"></div>
        <div class="bg-white rounded-2xl h-36 border border-[#eae3d7]"></div>
      </div>

      
      <div id="feedback-modal" class="absolute bottom-0 left-0 right-0 bg-white rounded-t-3xl z-20 transition-transform duration-300">

        
        <div class="flex justify-center pt-3 pb-2">
          <div class="w-10 h-1 rounded-full bg-gray-300"></div>
        </div>

        
        <div class="overflow-y-auto" style="max-height:580px">
          <div class="px-6 pb-6">

            
            <div class="text-center mb-5">
              <div id="modal-emoji" class="text-[40px] mb-2"></div>
              <div id="modal-title" class="text-[18px] font-semibold text-[#23293a]"></div>
              <div id="modal-subtitle" class="text-[12px] text-gray-400 mt-1"></div>
            </div>

            
            <div id="hl-star-rating" class="mb-5">
              <div class="text-[10px] font-semibold tracking-[0.15em] text-gray-400 uppercase mb-3 text-center" id="rating-label">Overall Experience</div>
              <div class="flex justify-center gap-3" id="star-row">
                <button onclick="setRating(1)" class="star-btn text-[28px] text-gray-300 transition-all hover:scale-110">&#9733;</button>
                <button onclick="setRating(2)" class="star-btn text-[28px] text-gray-300 transition-all hover:scale-110">&#9733;</button>
                <button onclick="setRating(3)" class="star-btn text-[28px] text-gray-300 transition-all hover:scale-110">&#9733;</button>
                <button onclick="setRating(4)" class="star-btn text-[28px] text-gray-300 transition-all hover:scale-110">&#9733;</button>
                <button onclick="setRating(5)" class="star-btn text-[28px] text-gray-300 transition-all hover:scale-110">&#9733;</button>
              </div>
              <div id="rating-text" class="text-[10px] text-gray-400 text-center mt-1.5"></div>
            </div>

            
            <div id="hl-category-pills" class="mb-5">
              <div class="text-[10px] font-semibold tracking-[0.15em] text-gray-400 uppercase mb-2.5" id="pills-label">What stood out?</div>
              <div id="category-pills" class="flex flex-wrap gap-2">
                
              </div>
            </div>

            
            <div id="hl-free-text" class="mb-5">
              <div class="text-[10px] font-semibold tracking-[0.15em] text-gray-400 uppercase mb-2">
                Anything else? <span class="text-gray-300">(optional)</span>
              </div>
              <textarea id="feedback-text" rows="3" placeholder="Share your thoughts..." class="w-full bg-[#f6f4f0] border border-[#eae3d7] rounded-2xl px-4 py-3 text-[13px] text-[#23293a] placeholder-gray-300 outline-none resize-none font-body leading-relaxed"></textarea>
            </div>

            
            <div id="hl-submit-row" class="flex gap-3">
              <button onclick="closeModal()" class="flex-1 py-3 rounded-2xl border-2 border-gray-200 text-[13px] font-semibold text-gray-500">Skip</button>
              <button id="submit-btn" onclick="submitFeedback()" class="flex-1 py-3 rounded-2xl text-[13px] font-semibold text-white" style="background:#4f46e5">Submit Feedback</button>
            </div>

          </div>
        </div>
      </div>

    </div>

    
    <div id="success-overlay" class="absolute inset-0 bg-[#f6f4f0] flex flex-col items-center justify-center z-40 hidden">
      <div class="w-20 h-20 rounded-full mb-6 flex items-center justify-center" style="background:#12B28C20">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none"><path d="M5 13L9 17L19 7" stroke="#12B28C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="text-[20px] font-semibold text-[#23293a] mb-2">Thank you!</div>
      <div id="success-body" class="text-[13px] text-gray-400 text-center px-10 leading-relaxed mb-8">Your feedback helps us improve your experience.</div>
      <button onclick="window.location.href='s1-trip-page.html'" class="px-8 py-3 rounded-2xl text-[13px] font-semibold text-white" style="background:#4f46e5">Back to Trip</button>
    </div>

  </div>

  

  <script>
    const FEEDBACK_CONFIGS = {
      planning: {
        emoji: '&#127919;',
        title: 'How was the planning?',
        subtitle: 'Maldives Honeymoon · 12 components finalised',
        ratingLabel: 'Planning Experience',
        pillsLabel: 'What stood out?',
        pills: ['Communication', 'Speed', 'Options quality', 'Pricing transparency', 'Flexibility', 'Attention to detail', 'Proactive suggestions'],
        textPlaceholder: 'What could we do better next time?',
        successBody: 'Your feedback helps your advisor and the team improve. Enjoy your trip!'
      },
      trip: {
        emoji: '&#9992;&#65039;',
        title: 'How was your trip?',
        subtitle: 'Maldives Honeymoon · Mar 15–22, 2026',
        ratingLabel: 'Overall Trip',
        pillsLabel: 'Highlights',
        pills: ['Hotels', 'Flights', 'Transfers', 'Dining', 'Activities', 'Advisor support', 'Exceeded expectations'],
        textPlaceholder: 'Tell us about your favourite moments...',
        successBody: 'Thanks for sharing! We\'d love to help plan your next trip.'
      }
    };

    const RATING_LABELS = ['', 'Poor', 'Below expectations', 'Met expectations', 'Great', 'Exceptional'];

    let currentRating = 0;
    let selectedPills = new Set();
    let currentType = 'planning';

    function showFeedback(type) {
      currentType = type;
      const cfg = FEEDBACK_CONFIGS[type];
      currentRating = 0;
      selectedPills = new Set();

      document.getElementById('modal-emoji').innerHTML = cfg.emoji;
      document.getElementById('modal-title').textContent = cfg.title;
      document.getElementById('modal-subtitle').textContent = cfg.subtitle;
      document.getElementById('rating-label').textContent = cfg.ratingLabel;
      document.getElementById('rating-text').textContent = '';
      document.getElementById('pills-label').textContent = cfg.pillsLabel;
      document.getElementById('feedback-text').placeholder = cfg.textPlaceholder;
      document.getElementById('success-body').textContent = cfg.successBody;

      // Reset stars
      document.querySelectorAll('.star-btn').forEach(s => s.style.color = '#d1d5db');

      // Render pills
      const pillsEl = document.getElementById('category-pills');
      pillsEl.innerHTML = cfg.pills.map(p => `
        <button onclick="togglePill(this, '${p}')" class="cat-pill px-3 py-1.5 text-[11px] rounded-full border border-[#eae3d7] text-[#23293a] font-medium transition-all hover:border-[#4f46e5] hover:bg-[#4f46e5]/5">${p}</button>
      `).join('');

      // Hide success
      document.getElementById('success-overlay').classList.add('hidden');

      // Demo buttons
      document.querySelectorAll('.fbtn').forEach(btn => {
        btn.className = 'fbtn px-3 py-1 text-xs rounded-full border border-gray-300 text-gray-600 font-medium transition-all';
      });
      const ab = document.getElementById('fbtn-' + type);
      if (ab) { ab.style.background = '#4f46e5'; ab.style.borderColor = '#4f46e5'; ab.style.color = 'white'; }
    }

    function setRating(n) {
      currentRating = n;
      const stars = document.querySelectorAll('.star-btn');
      stars.forEach((s, i) => {
        s.style.color = i < n ? '#f59e0b' : '#d1d5db';
      });
      document.getElementById('rating-text').textContent = RATING_LABELS[n] || '';
    }

    function togglePill(btn, pill) {
      if (selectedPills.has(pill)) {
        selectedPills.delete(pill);
        btn.style.background = '';
        btn.style.borderColor = '';
        btn.style.color = '';
      } else {
        selectedPills.add(pill);
        btn.style.background = '#4f46e510';
        btn.style.borderColor = '#4f46e5';
        btn.style.color = '#4f46e5';
      }
    }

    function submitFeedback() {
      document.getElementById('success-overlay').classList.remove('hidden');
    }

    function closeModal() {
      window.location.href = 's1-trip-page.html';
    }

    // Read URL param
    const params = new URLSearchParams(window.location.search);
    const typeParam = params.get('type') || 'planning';
    showFeedback(typeParam);

    const HIGHLIGHT_MAP = {
      'rate':     ['#feedback-modal'],
      'stars':    ['#hl-star-rating'],
      'pills':    ['#hl-category-pills'],
      'freetext': ['#hl-free-text'],
      'dismiss':  ['#hl-submit-row']
    };

    function toggleHighlight(checkbox) {
      const key = checkbox.dataset.hl;
      if (!key || !HIGHLIGHT_MAP[key]) return;
      const selectors = HIGHLIGHT_MAP[key];
      selectors.forEach(sel => {
        document.querySelectorAll(sel).forEach(el => {
          if (checkbox.checked) {
            if (!el.style.position || el.style.position === 'static') el.style.position = 'relative';
            el.classList.add('hl-highlight');
          } else {
            const stillHighlighted = Array.from(document.querySelectorAll('.hl-check:checked')).some(cb => {
              const cbKey = cb.dataset.hl;
              if (!cbKey || cbKey === key) return false;
              const cbSels = HIGHLIGHT_MAP[cbKey] || [];
              return cbSels.some(s => { try { return el.matches(s); } catch(e) { return false; } });
            });
            if (!stillHighlighted) el.classList.remove('hl-highlight');
          }
        });
      });
    }

    function updateCount() {
      const total = document.querySelectorAll('.hl-check').length;
      const checked = document.querySelectorAll('.hl-check:checked').length;
      const counter = document.getElementById('hl-counter');
      if (!counter) return;
      counter.textContent = checked + ' / ' + total;
      counter.style.color = checked === total ? '#12B28C' : '#9ca3af';
    }

    updateCount();
  </script>

</body>
</html>
